<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Gestión Académica</title>
    <style>
    :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --secondary: #6366f1;
        --bg: #f8fafc;
        --sidebar-bg: #1e293b;
        --sidebar-text: #94a3b8;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --success: #16a34a;
        --error: #dc2626;
        --border-radius: 16px;
        --box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * {
        box-sizing: border-box;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        min-height: 100vh;
    }

    /* BARRA LATERAL (SIDEBAR) */
    .sidebar {
        width: 280px;
        background-color: var(--sidebar-bg);
        color: white;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 4px 0 10px rgba(0, 0, 0, 0.05);
        flex-shrink: 0;
    }

    .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px 20px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 20px;
    }

    .sidebar-brand h2 {
        font-size: 1.15rem;
        color: #ffffff;
    }

    /* Menú Desplegable */
    .dropdown-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.05);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
    }

    .dropdown-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-left: 8px;
    }

    .dropdown-container.hidden {
        display: none;
    }

    .menu-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: transparent;
        color: var(--sidebar-text);
        border: none;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        text-align: left;
        transition: all 0.2s ease;
    }

    .menu-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #ffffff;
    }

    .menu-btn.active {
        background-color: var(--primary);
        color: #ffffff;
        font-weight: 600;
    }

    .sidebar-footer {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-reportes, .btn-logout {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        box-sizing: border-box;
    }

    .btn-reportes { background: #0284c7; color: white; }
    .btn-reportes:hover { background: #0369a1; }
    
    .btn-logout { background: #ef4444; color: white; }
    .btn-logout:hover { background: #dc2626; }

    /* CONTENIDO PRINCIPAL CENTRADO */
    .main-content {
        flex: 1;
        padding: 40px 20px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .header {
        margin-bottom: 32px;
        text-align: center;
        width: 100%;
        max-width: 800px;
    }

    .header h1 {
        font-size: 2rem;
        color: var(--text);
        margin-bottom: 6px;
        font-weight: 700;
    }

    /* TARJETA CENTRADA */
    .tab-content {
        display: none;
        width: 100%;
        max-width: 800px;
        animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
        display: block;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--border-radius);
        padding: 40px;
        box-shadow: var(--box-shadow);
        width: 100%;
        margin: 0 auto;
    }

    .card h2 {
        font-size: 1.35rem;
        color: var(--text);
        font-weight: 700;
        margin-bottom: 24px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
    }

    .form-group {
        margin-bottom: 22px;
    }

    label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-muted);
    }

    input, select {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
        background-color: #f8fafc;
        color: var(--text);
        transition: all 0.2s;
    }

    input:focus, select:focus {
        outline: none;
        background-color: #fff;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button.btn-submit {
        margin-top: 12px;
        width: 100%;
        padding: 16px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1.05rem;
        cursor: pointer;
        transition: background 0.2s;
    }

    button.btn-submit:hover {
        background-color: var(--primary-hover);
    }

    .alert {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        display: none;
        text-align: center;
    }
    .alert-success { background: #dcfce7; color: var(--success); }
    .alert-error { background: #fee2e2; color: var(--error); }

    @media (max-width: 900px) {
        body { flex-direction: column; }
        .sidebar { width: 100%; }
        .main-content { padding: 20px; }
        .tab-content { max-width: 100%; }
    }
</style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="sidebar-brand">
                <span style="font-size: 22px;">⚙️</span>
                <h2>Panel Admin</h2>
            </div>

            <button class="dropdown-btn" onclick="toggleDropdown()">
                <span>🏫 Gestión Escolar</span>
                <span id="arrowIcon">▼</span>
            </button>
            
            <div id="gestionSubmenu" class="dropdown-container">
                <button class="menu-btn active" onclick="switchTab('tabCurso', this)">🏫 1. Cursos</button>
                <button class="menu-btn" onclick="switchTab('tabAlumno', this)">🎓 2. Registrar Alumno</button>
                <button class="menu-btn" onclick="switchTab('tabExcel', this)">📊 3. Carga Masiva (Excel)</button>
            </div>
        </div>

        <div class="sidebar-footer">
            <a href="reporte.html" class="btn-reportes">
                📊 Ver Reportes
            </a>
            <button onclick="cerrarSesion()" class="btn-logout">
                🚪 Cerrar Sesión
            </button>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1 id="panelTitle">Registrar Curso</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Administración de cursos y matrículas de estudiantes.</p>
        </div>

        <!-- 1. CURSOS -->
        <div id="tabCurso" class="tab-content active">
            <div class="card">
                <h2>Registrar Nuevo Curso</h2>
                <form onsubmit="guardarCurso(event)">
                    <div class="form-group">
                        <label>Docente Encargado</label>
                        <input type="text" id="docenteAutenticadoNombre" disabled placeholder="Cargando sesión...">
                    </div>
                    <div class="form-group">
                        <label>Nombre del Curso</label>
                        <input type="text" id="cursoNombre" required placeholder="Ej. 1ro Básico 'A'">
                    </div>
                    <button type="submit" class="btn-submit">Guardar Curso</button>
                    <div id="msgCurso" class="alert"></div>
                </form>
            </div>
        </div>

        <!-- 2. ALUMNOS (INDIVIDUAL) -->
        <div id="tabAlumno" class="tab-content">
            <div class="card">
                <h2>Registrar Alumno Individual</h2>
                <form onsubmit="guardarAlumno(event)">
                    <div class="form-group">
                        <label>Curso Asignado</label>
                        <select id="selectCursos" required><option value="">Cargando cursos...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Nombre Completo del Estudiante</label>
                        <input type="text" id="alumnoNombre" required placeholder="Ej. Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label>Código o Cédula (Opcional)</label>
                        <input type="text" id="alumnoCodigo" placeholder="Ej. EST-2026-001">
                    </div>
                    <button type="submit" class="btn-submit">Guardar Alumno</button>
                    <div id="msgAlumno" class="alert"></div>
                </form>
            </div>
        </div>

        <!-- 3. IMPORTAR EXCEL -->
        <div id="tabExcel" class="tab-content">
            <div class="card">
                <h2>Carga Masiva de Alumnos desde Excel</h2>
                <form onsubmit="importarExcel(event)">
                    <div class="form-group">
                        <label>Curso de Destino</label>
                        <select id="selectCursoExcel" required><option value="">Cargando cursos...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Archivo Excel (.xlsx / .xls)</label>
                        <input type="file" id="archivoExcel" accept=".xlsx, .xls" required>
                    </div>
                    <button type="submit" class="btn-submit">Cargar e Importar Alumnos</button>
                    <div id="msgExcel" class="alert"></div>
                </form>
            </div>
        </div>
    </main>

    <script>
        const API = "http://localhost:3000/api";
        let docenteSesion = null;

        document.addEventListener("DOMContentLoaded", () => {
            const sesionData = localStorage.getItem('docenteSesion');
            if (!sesionData) {
                window.location.href = "login.html";
                return;
            }

            docenteSesion = JSON.parse(sesionData);

            const inputDocente = document.getElementById('docenteAutenticadoNombre');
            if (inputDocente) {
                inputDocente.value = docenteSesion.nombre || "Docente Autenticado";
            }

            cargarCursos();
        });

        function toggleDropdown() {
            const submenu = document.getElementById('gestionSubmenu');
            const arrow = document.getElementById('arrowIcon');
            submenu.classList.toggle('hidden');
            arrow.textContent = submenu.classList.contains('hidden') ? '►' : '▼';
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            
            document.getElementById('panelTitle').textContent = btn.textContent.replace(/[0-9.🏫🎓📊]\s*/g, '');
        }

        async function cargarCursos() {
            try {
                const res = await fetch(`${API}/cursos?id_docente=${docenteSesion.id_docente}`);
                let data = await res.json();
                
                if (Array.isArray(data)) {
                    data = data.filter(c => c.id_docente == docenteSesion.id_docente);
                }

                fillSelect('selectCursos', data, 'id_curso', 'nombre_curso');
                fillSelect('selectCursoExcel', data, 'id_curso', 'nombre_curso');
            } catch (e) { 
                console.error("Error cargando cursos", e); 
            }
        }

        function fillSelect(elementId, items, valueProp, textProp) {
            const el = document.getElementById(elementId);
            el.innerHTML = '<option value="">-- Seleccionar --</option>';
            items.forEach(i => {
                const option = document.createElement('option');
                option.value = i[valueProp];
                option.textContent = i[textProp];
                el.appendChild(option);
            });
        }

        async function postData(endpoint, data, msgId, formElement, callback) {
            const alertEl = document.getElementById(msgId);
            try {
                const res = await fetch(`${API}/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showAlert(alertEl, "Guardado exitosamente.", true);
                    if (formElement) formElement.reset();
                    if (callback) callback();
                } else {
                    const err = await res.json();
                    showAlert(alertEl, err.error || "Error al guardar datos.", false);
                }
            } catch (e) {
                showAlert(alertEl, "Error de conexión con el servidor Node.js.", false);
            }
        }

        function guardarCurso(e) {
            e.preventDefault();
            
            if (!docenteSesion || !docenteSesion.id_docente) {
                showAlert(document.getElementById('msgCurso'), "Error: Sesión no válida.", false);
                return;
            }

            postData('cursos', {
                id_docente: docenteSesion.id_docente,
                nombre_curso: document.getElementById('cursoNombre').value
            }, 'msgCurso', e.target, cargarCursos);
        }

        function guardarAlumno(e) {
            e.preventDefault();
            postData('alumnos', {
                id_curso: document.getElementById('selectCursos').value,
                nombre_completo: document.getElementById('alumnoNombre').value,
                codigo_estudiante: document.getElementById('alumnoCodigo').value || null
            }, 'msgAlumno', e.target);
        }

        async function importarExcel(e) {
            e.preventDefault();
            const form = e.target;
            const fileInput = document.getElementById("archivoExcel");
            const alertEl = document.getElementById("msgExcel");
            const formData = new FormData();
            formData.append("excelFile", fileInput.files[0]);
            formData.append("id_curso", document.getElementById("selectCursoExcel").value);

            try {
                const res = await fetch(`${API}/alumnos/upload-excel`, { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    showAlert(alertEl, data.message, true);
                    form.reset();
                } else {
                    showAlert(alertEl, data.error, false);
                }
            } catch (err) {
                showAlert(alertEl, "Error al procesar archivo.", false);
            }
        }

        function showAlert(el, msg, isSuccess) {
            el.textContent = msg;
            el.className = `alert ${isSuccess ? 'alert-success' : 'alert-error'}`;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function cerrarSesion() {
            localStorage.removeItem('docenteSesion');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
